{% extends "base.html" %}
{% block title %}Resume — Lianghok{% endblock %}
{% block content %}
<section class="pt-32 pb-24 px-6 min-h-screen">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between flex-wrap gap-4 mb-8">
      <h1 class="font-display text-3xl font-700">Resume</h1>
      <div class="flex gap-3">
        <a href="{{ url_for('home.download_cv') }}" class="btn-primary"><i class="fa-solid fa-download"></i> Download</a>
        <button onclick="window.print()" class="btn-secondary"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
    <div class="glass rounded-2xl overflow-hidden" style="height:80vh;">
      <embed src="{{ url_for('home.download_cv') }}" type="application/pdf" width="100%" height="100%">
    </div>
    <p class="text-sm text-slate-400 mt-4">If the preview doesn't load, use the download button above.</p>
  </div>
</section>
{% endblock %}
